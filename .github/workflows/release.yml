name: Release

on:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

jobs:
  npm:
    name: Release on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from release tag
        run: echo "VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set package version from tag
        run: echo $(jq --arg v "${{ env.VERSION }}" '(.version) = $v' package.json) > package.json

      - run: npm ci

      - run: npm run build

      # Publishes `upstash` (the name in package.json), then the same build
      # again as @upstash/cli so existing installs keep getting releases.
      - name: Publish release candidate
        if: github.event.release.prerelease
        run: npm publish --access public --tag=canary --provenance

      - name: Publish
        if: "!github.event.release.prerelease"
        run: npm publish --access public --provenance

      - name: Rename the package to @upstash/cli
        run: |
          jq '.name = "@upstash/cli"' package.json > package.tmp.json
          mv package.tmp.json package.json

      - name: Publish @upstash/cli release candidate
        if: github.event.release.prerelease
        run: npm publish --access public --tag=canary --provenance

      - name: Publish @upstash/cli
        if: "!github.event.release.prerelease"
        run: npm publish --access public --provenance
